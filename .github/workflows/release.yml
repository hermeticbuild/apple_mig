name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to release
        required: true
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    # BCR's SLSA verifier requires a typed workflow ref in the signer identity;
    # a raw commit SHA is rejected even when it resolves to this release tag.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      bazel_test_command: bazel build //:mig //:migcom
      draft: ${{ github.event_name == 'push' }}
      prerelease: false
      release_files: apple_mig-*.tar.gz
      tag_name: ${{ inputs.tag_name || github.ref_name }}

  publish:
    needs: release
    uses: ./.github/workflows/publish.yml
    with:
      attest: true
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          draft: false
          tag_name: ${{ inputs.tag_name || github.ref_name }}
