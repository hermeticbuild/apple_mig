name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      templates_ref:
        required: false
        type: string
      attest:
        default: true
        required: false
        type: boolean
    secrets:
      publish_token:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to publish
        required: true
        type: string
      templates_ref:
        description: Ref containing corrected BCR templates
        required: false
        type: string
      attest:
        description: Publish release and entry attestations
        default: false
        required: true
        type: boolean

jobs:
  publish:
    # Keep the tag in the attestation signer identity. slsa-verifier does not
    # accept a reusable workflow invoked through an untyped raw commit SHA.
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0
    with:
      attest: ${{ inputs.attest }}
      draft: false
      registry_fork: hermeticbuild/bazel-central-registry
      tag_name: ${{ inputs.tag_name }}
      templates_ref: ${{ inputs.templates_ref }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
