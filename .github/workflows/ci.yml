name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cross-compile:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            platform: "@llvm//platforms:linux_amd64"
            artifact_pattern: "ELF 64-bit.*x86-64"
          - name: Linux arm64
            platform: "@llvm//platforms:linux_arm64"
            artifact_pattern: "ELF 64-bit.*ARM aarch64"
          - name: macOS amd64
            platform: "@llvm//platforms:macos_amd64"
            artifact_pattern: "Mach-O 64-bit.*x86_64"
          - name: macOS arm64
            platform: "@llvm//platforms:macos_arm64"
            artifact_pattern: "Mach-O 64-bit.*arm64"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and inspect migcom
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          ARTIFACT_PATTERN: ${{ matrix.artifact_pattern }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BUILDBUDDY_API_KEY}" ]]; then
            echo "BUILDBUDDY_API_KEY is required" >&2
            exit 1
          fi

          bazel_flags=(
            --bazelrc="${GITHUB_WORKSPACE}/.github/workflows/ci.bazelrc"
            "--remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}"
          )

          bazel "${bazel_flags[@]}" build \
            "--platforms=${TARGET_PLATFORM}" \
            //:mig \
            //:migcom

          migcom_path="$(bazel "${bazel_flags[@]}" cquery \
            "--platforms=${TARGET_PLATFORM}" \
            --output=files \
            //:migcom)"
          artifact="$(file "${migcom_path}")"
          echo "${artifact}"

          if [[ ! "${artifact}" =~ ${ARTIFACT_PATTERN} ]]; then
            echo "unexpected migcom format for ${TARGET_PLATFORM}" >&2
            exit 1
          fi
